[package]
name = "vrf-demo"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vrf_demo"

[features]
default = ["devnet"]
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "orao-solana-vrf/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
cfg-if = "1.0.0"
orao-solana-vrf = { version = "0.8.1", default-features = false, features = ["cpi"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "vrf"] }
solana-ecvrf = "0.0.1"
switchboard-on-demand = { version = "0.13.0", default-features = false, features = ["solana-v3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
